name: Scheduled Cloud Code Review

on:
  schedule:
    # 08 Oct à 09:00 UTC (10:00 heure Maroc)
    - cron: '0 9 8 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "Amine Arheche"
          git config --global user.email "aminearheche@gmail.com"

      - name: Execute Review Suite
        run: |
          python .github/scripts/run_cloud_review.py
